name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  launcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          shellcheck agent-capsule entrypoint.sh scripts/check-shell-completion \
            tests/agent-capsule_test.sh tests/worklog_test.sh tests/install_test.sh \
            completions/agent-capsule.bash

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  # Every image now carries one agent and only the selected integrations, so
  # each agent needs its own build. anydoc and worklog are claude-only, matching the launcher.
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, opencode]
    steps:
      - uses: actions/checkout@v7
      - name: Build the ${{ matrix.agent }} image with every supported integration
        run: |
          anydoc=0
          worklog=0
          if [ "${{ matrix.agent }}" = claude ]; then anydoc=1; worklog=1; fi
          docker build -t agent-capsule:test \
            --build-arg "AGENT=${{ matrix.agent }}" \
            --build-arg "WITH_ANYDOC=$anydoc" \
            --build-arg WITH_EXPLAIN_DIFF=1 \
            --build-arg WITH_GITHUB=1 \
            --build-arg WITH_GITLAB=1 \
            --build-arg WITH_KUBERNETES=1 \
            --build-arg WITH_MCPVAULT=1 \
            --build-arg WITH_SUPERPOWERS=1 \
            --build-arg WITH_TALOS=1 \
            --build-arg "WITH_WORKLOG=$worklog" \
            .
      - name: Only the selected agent is installed
        run: |
          docker run --rm -e "AGENT_CAPSULE_AGENT=${{ matrix.agent }}" \
            agent-capsule:test "${{ matrix.agent }}" --version
          for other in claude codex opencode; do
            if [ "$other" = "${{ matrix.agent }}" ]; then continue; fi
            if docker run --rm agent-capsule:test bash -c "command -v $other"; then
              echo "$other is present in the ${{ matrix.agent }} image" >&2
              exit 1
            fi
          done
      - name: Selected integrations are present
        run: |
          docker run --rm agent-capsule:test bash -c 'test -d /opt/superpowers/source'
          docker run --rm agent-capsule:test bash -c 'test -f /opt/explain-diff-html/SKILL.md'
          docker run --rm agent-capsule:test mcpvault --help
          docker run --rm agent-capsule:test bash -c 'test -f /opt/worklog/plugin/.claude-plugin/plugin.json'
      - name: Cluster CLIs are installed
        run: |
          docker run --rm agent-capsule:test kubectl version --client
          docker run --rm agent-capsule:test helm version
          docker run --rm agent-capsule:test talosctl version --client
      - name: gh is installed
        run: docker run --rm agent-capsule:test gh --version
      - name: glab is installed, with usage telemetry off
        run: |
          docker run --rm agent-capsule:test glab version
          docker run --rm agent-capsule:test glab config get telemetry | grep -qx false
      # Mounted the way the launcher does it, and as a non-root user like --keep-id.
      - name: curl, git, and Node trust a mounted private CA
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj '/CN=Capsule Smoke Root' -keyout ca.key -out ca.crt \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign'
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -subj '/CN=localhost' -keyout leaf.key -out leaf.csr
          printf 'subjectAltName=DNS:localhost\n' > leaf.ext
          openssl x509 -req -in leaf.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 \
            -extfile leaf.ext -out leaf.crt
          mkdir ca
          cp ca.crt ca/extra.pem
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$smoke_dir:/smoke:ro" -v "$smoke_dir/ca:/run/agent-capsule/ca" \
            -e AGENT_CAPSULE_CA_DIR=/run/agent-capsule/ca \
            agent-capsule:test bash -c '
              set -e
              openssl s_server -quiet -www -accept 8443 \
                -cert /smoke/leaf.crt -key /smoke/leaf.key &
              sleep 1
              curl -sSf -o /dev/null https://localhost:8443/
              git ls-remote https://localhost:8443/repo 2>&1 | grep -F "not valid"
              node -e "require(\"https\").get(\"https://localhost:8443/\", () => process.exit(0))
                .on(\"error\", e => { console.error(e.message); process.exit(1) })"
            '
      - name: The explain-diff skill is linked and then removed again
        run: |
          skills_home="capsule-skills-smoke-${GITHUB_RUN_ID}-${{ matrix.agent }}"
          trap 'docker volume rm "$skills_home" >/dev/null' EXIT
          docker volume create "$skills_home"
          docker run --rm -v "$skills_home:/home/dev" \
            -e AGENT_CAPSULE_SKILLS_DIR=/home/dev/skills \
            -e AGENT_CAPSULE_WITH=explain-diff \
            agent-capsule:test bash -c 'test -f /home/dev/skills/explain-diff-html/SKILL.md'
          docker run --rm -v "$skills_home:/home/dev" \
            -e AGENT_CAPSULE_SKILLS_DIR=/home/dev/skills \
            -e AGENT_CAPSULE_WITH= \
            agent-capsule:test bash -c 'test ! -e /home/dev/skills/explain-diff-html'
      - name: Claude loads both plugin directories
        if: matrix.agent == 'claude'
        run: |
          docker run --rm agent-capsule:test \
            claude --plugin-dir /opt/superpowers/source --version
          docker run --rm agent-capsule:test \
            claude --plugin-dir /opt/anydoc/plugin --version
      - name: OpenCode loads superpowers from invocation-scoped config
        if: matrix.agent == 'opencode'
        run: |
          docker run --rm -e AGENT_CAPSULE_AGENT=opencode \
            -e AGENT_CAPSULE_WITH=superpowers \
            -e 'OPENCODE_CONFIG_CONTENT={"plugin":["/opt/superpowers/source"]}' \
            agent-capsule:test opencode debug config | \
            grep -F '/opt/superpowers/source'
      # As root, and as a non-root user like --keep-id, who does not own the image's superpowers clone.
      - name: Codex adds and removes the superpowers plugin
        if: matrix.agent == 'codex'
        run: |
          for user in 0:0 "$(id -u):$(id -g)"; do
            codex_home="$(mktemp -d)"
            docker run --rm --user "$user" -v "$codex_home:/home/dev" \
              -e AGENT_CAPSULE_AGENT=codex \
              -e AGENT_CAPSULE_WITH=superpowers \
              agent-capsule:test bash -c \
              'test -e /home/dev/.codex/.superpowers-capsule-managed && \
               ! codex plugin list --json | tr -d "[:space:]" | grep -Fq "\"installed\":[]"'
            docker run --rm --user "$user" -v "$codex_home:/home/dev" \
              -e AGENT_CAPSULE_AGENT=codex \
              -e AGENT_CAPSULE_WITH= \
              agent-capsule:test bash -c \
              'test ! -e /home/dev/.codex/.superpowers-capsule-managed && \
               codex plugin list --json | tr -d "[:space:]" | grep -Fq "\"installed\":[]"'
          done

  # The matrix enables every integration, so only a default build can show that
  # optional CLIs stay out unless selected.
  image-default:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agent-capsule:default .
      - name: Unselected CLIs are absent
        run: |
          # Otherwise a broken image would pass every absence check below.
          docker run --rm agent-capsule:default true
          for tool in kubectl helm talosctl gh glab; do
            if docker run --rm agent-capsule:default bash -c "command -v $tool"; then
              echo "$tool is present in the default image" >&2
              exit 1
            fi
          done
      - name: Legacy zone names resolve
        run: docker run --rm -e TZ=US/Eastern agent-capsule:default date +%Z | grep -Eqx 'E[SD]T'

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
